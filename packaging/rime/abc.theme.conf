# 智能ABC 风格主题（fcitx5 classicui）
#
# 设计目标（对齐 Windows 智能ABC）：
#   - 白底 + 1px 黑框，无圆角阴影
#   - 候选竖排、带 1. 2. 3. 编号（编号由 addon 的 labels 提供）
#   - 高亮候选只变字色（蓝），不加背景块
#   - 组字框与候选窗共用同一个窗口（fcitx5 限制，无法拆成两个框）
[Metadata]
Name=智能ABC
Version=1
Author=abc
Description=智能ABC 风格：白底黑框、蓝色高亮、竖排候选
ScaleWithDPI=True

[InputPanel]
# 字号与颜色
Font=Sans 12
# 普通候选字颜色
NormalColor=#000000
# 高亮候选字颜色（智能ABC 的蓝色）
HighlightCandidateColor=#0000cc
# 组字框文字颜色
HighlightColor=#1a1a1a
# 组字框文字背景色
HighlightBackgroundColor=#ffffff
Spacing=8

[InputPanel/TextMargin]
Left=8
Right=8
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Color=#ffffff
BorderColor=#000000
BorderWidth=1

[InputPanel/Background/Margin]
Left=1
Right=1
Top=1
Bottom=1

# 高亮背景与底色一致：只让文字变蓝，不画色块
[InputPanel/Highlight]
Color=#ffffff

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=5
Bottom=5

[Menu/Background]
Color=#ffffff
BorderColor=#000000
BorderWidth=1

[Menu/Background/Margin]
Left=1
Right=1
Top=1
Bottom=1

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#ffffff

[Menu/Highlight/Margin]
Left=6
Right=6
Top=4
Bottom=4

[Menu/Separator]
Color=#c0c0c0

[Menu/TextMargin]
Left=6
Right=6
Top=4
Bottom=4

# 留空：不让系统强调色覆盖上面的配色
[AccentColorField]
