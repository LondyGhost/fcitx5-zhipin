# Linux 智能 ABC — 用户配置模板（A5）
# 契约：docs/interfaces/config.md（键表/默认值/范围/解析规则）。
# 安装目标：~/.config/abc/config.ini（首次安装时若已存在则跳过，绝不覆盖用户配置）。
# 修改后重启 fcitx5 或重新激活输入法生效。

# 初始模式：chinese | english（默认 chinese）
initialMode = chinese

# 候选页大小：1..9（默认 9；候选用数字 1-9 选择，页大小上限 9）
pageSize = 9

# 输入缓冲字符上限：1..256（默认 64；超限字符不入缓冲并转发给应用）
maxBufferChars = 64

# 组合中按空格但无候选时的策略：commit_raw（提交原文后转发）| keep_buffer（保留组合）
spaceNoCandidatePolicy = commit_raw

# 中英文切换时对未提交组合的处理：commit_raw（提交原文）| clear（清除）
modeSwitchCompositionPolicy = commit_raw

# 编译后的引擎索引路径（由 A2 导入器生成；支持 ~ 展开，可含空格）
indexPath = ~/.local/share/abc/index.abcdix

# 中英文切换热键（fcitx5 键名，由 addon 识别并转换为 kModeSwitch）
modeSwitchKey = Shift

# 预编辑是否送入应用窗口：true | false
preeditInClient = true
